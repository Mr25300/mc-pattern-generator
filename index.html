<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>MC Pattern Generator</title>
    </head>

    <body>
        <div>
            <input type="input" placeholder="Columns" id="cols-input">
            <input type="input" placeholder="Rows" id="rows-input">

            <br>

            <label for="x-freq-range">Horizontal Frequency</label>
            <input type="range" min="-4" max="4" step="0.1" value="0" id="x-freq-range">

            <label for="y-freq-range">Vertical Frequency</label>
            <input type="range" min="-4" max="4" step="0.1" value="0" id="y-freq-range">

            <br>

            <button type="button" id="add-block-btn">Add Block</button>

            <div id="block-container"></div>

            <br>

            <button type="button" id="regen-btn">Regenerate</button>
        </div>

        <br>

        <canvas id="grid-canvas"></canvas>

        <script type="module" src="app.ts"></script>
    </body>
</html>
